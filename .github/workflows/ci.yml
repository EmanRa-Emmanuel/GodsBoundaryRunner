name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Restore
      run: dotnet restore GodsBoundaryRunner/GodsBoundaryRunner.csproj
    - name: Build
      run: dotnet build --no-restore -c Release GodsBoundaryRunner/GodsBoundaryRunner.csproj
    - name: Run tests
      run: dotnet test --no-build -c Release Tests/GodsBoundaryRunner.Tests/GodsBoundaryRunner.Tests.csproj
